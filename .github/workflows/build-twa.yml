name: Build BBP TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Setup upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Verwende gespeicherten Keystore aus Secret"
            echo "$KEYSTORE_B64" | base64 -d > bbp-upload.keystore
          else
            echo "Generiere neuen Keystore (einmalig)"
            keytool -genkeypair \
              -alias bbp-trainer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore bbp-upload.keystore \
              -storepass bbpUpload1 -keypass bbpUpload1 \
              -dname "CN=BBP Trainer,O=SelfMadeSportApps,C=DE" \
              -noprompt
          fi
          echo "=== Keystore Fingerprint ==="
          keytool -list -v -keystore bbp-upload.keystore -storepass bbpUpload1 \
            | grep "SHA1:"

      - name: Save keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbp-upload-keystore
          path: bbp-upload.keystore
          retention-days: 90

      - name: Create Android TWA project
        run: |
          mkdir -p twa/app/src/main/res/values
          mkdir -p twa/app/src/main/res/mipmap-hdpi
          mkdir -p twa/app/src/main/res/mipmap-xhdpi
          mkdir -p twa/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi

          cat > twa/settings.gradle << 'EOF'
          rootProject.name = "BBPTrainer"
          include ':app'
          EOF

          cat > twa/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.4.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > twa/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.propanfloete7687.bbp'
              compileSdk 36
              defaultConfig {
                  applicationId "io.github.propanfloete7687.bbp"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "1.2"
              }
              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/../bbp-upload.keystore")
                      storePassword "bbpUpload1"
                      keyAlias "bbp-trainer"
                      keyPassword "bbpUpload1"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > twa/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="com.android.vending.BILLING" />
            <application
              android:label="BBP Trainer"
              android:icon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.Translucent.NoTitleBar">
              <activity
                android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://propanfloete7687.github.io/bbp/"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="https"
                    android:host="propanfloete7687.github.io"
                    android:pathPrefix="/bbp/"/>
                </intent-filter>
              </activity>
              <service
                android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.support.customtabs.action.CustomTabsService"/>
                </intent-filter>
              </service>
            </application>
          </manifest>
          EOF

          cat > twa/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
            <string name="app_name">BBP Trainer</string>
          </resources>
          EOF

          cat > twa/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Download icons
        run: |
          curl -sL "https://propanfloete7687.github.io/bbp/icon-192.png" \
            -o twa/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          for d in hdpi xxhdpi xxxhdpi; do
            cp twa/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
               twa/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build AAB
        run: gradle --project-dir twa bundleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bbp-trainer-aab
          path: twa/app/build/outputs/bundle/release/app-release.aab
